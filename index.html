<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C4 Model Editor</title>
<style>
/* ── Theme variables ──────────────────────────────────────────────────────── */
:root {
  --bg-app:    #1a1a2e;
  --bg-canvas: #0d1117;
  --bg-panel:  #16213e;
  --bg-input:  #0d1117;
  --bg-hover:  #0f3460;
  --border:    #0f3460;
  --text:      #e0e0e0;
  --text-muted:#888;
  --accent:    #4a90d9;
  --accent-2:  #e94560;
  --grid:      rgba(255,255,255,0.03);
  --shadow:    rgba(0,0,0,0.5);
  --btn-bg:    #0f3460;
  --btn-text:  #ccc;
  --ctx-bg:    #16213e;
  --modal-bg:  #16213e;
}
:root[data-theme="light"] {
  --bg-app:    #f0f2f5;
  --bg-canvas: #ffffff;
  --bg-panel:  #ffffff;
  --bg-input:  #f0f2f5;
  --bg-hover:  #e8edf5;
  --border:    #d0d7de;
  --text:      #1f2328;
  --text-muted:#6e7781;
  --accent:    #0969da;
  --accent-2:  #cf222e;
  --grid:      rgba(0,0,0,0.04);
  --shadow:    rgba(0,0,0,0.15);
  --btn-bg:    #e8edf5;
  --btn-text:  #1f2328;
  --ctx-bg:    #ffffff;
  --modal-bg:  #ffffff;
}

/* ── Reset ────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-app);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  touch-action: none;
}

/* ── Header ───────────────────────────────────────────────────────────────── */
#header {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  flex-wrap: wrap;
  min-height: 48px;
}
#header h1 { font-size: 15px; font-weight: 700; color: var(--accent-2); letter-spacing: 1px; white-space: nowrap; }

.level-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
.level-tab {
  padding: 5px 11px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  background: transparent;
  color: var(--text-muted);
  transition: all 0.15s;
  white-space: nowrap;
}
.level-tab.active  { background: var(--accent); color: #fff; border-color: var(--accent); }
.level-tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }

#breadcrumb { display: flex; align-items: center; gap: 5px; font-size: 12px; flex-wrap: wrap; min-width: 0; }
.bc-sep     { color: var(--text-muted); }
.bc-item    { color: var(--accent); cursor: pointer; }
.bc-item:hover { text-decoration: underline; }
.bc-current { color: var(--text-muted); }

#header-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn {
  padding: 6px 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 12px;
  background: var(--btn-bg);
  color: var(--btn-text);
  transition: all 0.15s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover   { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger  { border-color: var(--accent-2); color: var(--accent-2); background: transparent; }
.btn.danger:hover { background: var(--accent-2); color: #fff; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(0.88); }
.btn.active  { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Theme toggle */
#btn-theme { font-size: 16px; padding: 5px 8px; }

/* Mobile hamburger buttons */
.hamburger { display: none; }
@media (max-width: 767px) {
  .hamburger { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: var(--btn-bg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 18px; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  #breadcrumb, #status-hint { display: none; }
  .level-tab { padding: 4px 8px; font-size: 11px; }
  #header h1 { font-size: 13px; }
  #btn-import, #btn-clear { display: none; }
}

/* ── Main layout ─────────────────────────────────────────────────────────── */
#main { display: flex; flex: 1; overflow: hidden; position: relative; }

/* ── Sidebar ──────────────────────────────────────────────────────────────── */
#sidebar {
  width: 200px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  transition: transform 0.25s ease;
}
#sidebar-header { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
#shape-palette  { padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.shape-item {
  padding: 9px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: grab;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
.shape-item:hover  { border-color: var(--accent); background: var(--bg-hover); }
.shape-item:active { cursor: grabbing; background: var(--bg-hover); }
.shape-icon { width: 20px; text-align: center; }

/* ── Canvas area ─────────────────────────────────────────────────────────── */
#canvas-container { flex: 1; position: relative; overflow: hidden; background: var(--bg-canvas); }
#canvas { position: absolute; top: 0; left: 0; cursor: default; touch-action: none; }
#canvas.panning         { cursor: grab; }
#canvas.panning-active  { cursor: grabbing; }
#canvas.adding-rel      { cursor: crosshair; }

/* ── Property panel ──────────────────────────────────────────────────────── */
#properties {
  width: 220px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  transition: transform 0.25s ease;
}
#properties-header  { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
#properties-content { padding: 10px; display: flex; flex-direction: column; gap: 9px; }
.prop-group   { display: flex; flex-direction: column; gap: 4px; }
.prop-label   { font-size: 11px; color: var(--text-muted); }
.prop-input, .prop-textarea, .prop-select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 3px;
  font-size: 12px;
  width: 100%;
  font-family: inherit;
}
.prop-textarea { resize: vertical; min-height: 56px; }
.prop-input:focus, .prop-textarea:focus, .prop-select:focus { outline: none; border-color: var(--accent); }
.prop-color  { display: flex; gap: 6px; align-items: center; }
.prop-color input[type=color] { width: 32px; height: 28px; padding: 1px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg-input); cursor: pointer; flex-shrink: 0; }
#no-selection { padding: 20px 12px; color: var(--text-muted); font-size: 12px; text-align: center; }

/* ── Mobile drawer behaviour ─────────────────────────────────────────────── */
@media (max-width: 767px) {
  #sidebar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    z-index: 200;
    width: 200px;
    transform: translateX(-100%);
    box-shadow: 4px 0 16px var(--shadow);
  }
  #sidebar.open    { transform: translateX(0); }
  #properties {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    z-index: 200;
    width: 220px;
    transform: translateX(100%);
    box-shadow: -4px 0 16px var(--shadow);
  }
  #properties.open { transform: translateX(0); }
  #minimap         { display: none; }
  #legend          { display: none; }
}
/* Overlay behind open drawer */
#drawer-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 199;
}
#drawer-overlay.visible { display: block; }

/* ── Status bar ──────────────────────────────────────────────────────────── */
#statusbar { background: var(--bg-panel); border-top: 1px solid var(--border); padding: 4px 12px; font-size: 11px; color: var(--text-muted); display: flex; gap: 16px; flex-shrink: 0; }

/* ── Context menu ────────────────────────────────────────────────────────── */
#context-menu {
  position: fixed;
  background: var(--ctx-bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 0;
  min-width: 164px;
  z-index: 1000;
  box-shadow: 0 4px 16px var(--shadow);
  display: none;
}
.ctx-item  { padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--text); }
.ctx-item:hover { background: var(--bg-hover); }
.ctx-item.danger { color: var(--accent-2); }
.ctx-separator { border-top: 1px solid var(--border); margin: 4px 0; }

/* ── Modal ───────────────────────────────────────────────────────────────── */
#modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; }
#modal-overlay.open { display: flex; }
.modal { background: var(--modal-bg); border: 1px solid var(--border); border-radius: 6px; padding: 20px; width: 100%; max-width: 520px; }
.modal h2 { font-size: 14px; margin-bottom: 14px; color: var(--accent); }
.modal textarea { width: 100%; height: 120px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 4px; font-size: 12px; font-family: monospace; }
.modal textarea:focus { outline: none; border-color: var(--accent); }
.modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

/* ── Minimap ─────────────────────────────────────────────────────────────── */
#minimap { position: absolute; bottom: 52px; right: 12px; border: 1px solid var(--border); border-radius: 4px; }

/* ── Zoom controls ───────────────────────────────────────────────────────── */
#zoom-controls {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; align-items: center;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  box-shadow: 0 2px 8px var(--shadow);
}
#zoom-label  { font-size: 11px; color: var(--text-muted); min-width: 42px; text-align: center; }
.zoom-btn    { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; -webkit-tap-highlight-color: transparent; }
.zoom-btn:hover { color: var(--text); }

/* ── Selection box ───────────────────────────────────────────────────────── */
#selection-box { position: absolute; border: 1.5px dashed var(--accent); background: rgba(74,144,217,0.07); pointer-events: none; display: none; }

/* ── Tooltip ─────────────────────────────────────────────────────────────── */
#tooltip { position: fixed; background: var(--bg-panel); border: 1px solid var(--border); padding: 4px 8px; border-radius: 3px; font-size: 11px; color: var(--text); pointer-events: none; z-index: 3000; display: none; max-width: 220px; }

/* ── Legend ──────────────────────────────────────────────────────────────── */
#legend { position: absolute; top: 12px; right: 12px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: 10px; color: var(--text-muted); opacity: 0.92; }
#legend div { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
#legend div:last-child { margin-bottom: 0; }
.legend-box { width: 12px; height: 10px; border-radius: 2px; border: 1px solid; flex-shrink: 0; }

/* ── Drag ghost ──────────────────────────────────────────────────────────── */
#drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  background: var(--accent);
  color: #fff;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  opacity: 0.85;
  display: none;
  white-space: nowrap;
  box-shadow: 0 4px 12px var(--shadow);
}
</style>
</head>
<body>

<div id="header">
  <button class="hamburger" id="btn-sidebar-toggle" title="Elements">☰</button>
  <h1>C4 Editor</h1>
  <div class="level-tabs">
    <button class="level-tab active" data-level="context">L1 Context</button>
    <button class="level-tab" data-level="container">L2 Container</button>
    <button class="level-tab" data-level="component">L3 Component</button>
    <button class="level-tab" data-level="code">L4 Code</button>
  </div>
  <div id="breadcrumb"></div>
  <div id="header-right">
    <button class="btn" id="btn-theme" title="Toggle theme">🌙</button>
    <button class="btn" id="btn-import">Import</button>
    <button class="btn" id="btn-export">Export</button>
    <button class="btn primary" id="btn-add-rel">+ Relation</button>
    <button class="btn danger" id="btn-clear">Clear</button>
    <button class="hamburger" id="btn-props-toggle" title="Properties">⚙</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">Elements</div>
    <div id="shape-palette"></div>
  </div>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>
    <div id="drawer-overlay"></div>
    <div id="selection-box"></div>
    <div id="zoom-controls">
      <button class="zoom-btn" id="btn-zoom-out">−</button>
      <span id="zoom-label">100%</span>
      <button class="zoom-btn" id="btn-zoom-in">+</button>
      <button class="zoom-btn" id="btn-zoom-fit" title="Fit to screen">⊡</button>
    </div>
    <canvas id="minimap" width="150" height="110"></canvas>
    <div id="legend"></div>
  </div>

  <div id="properties">
    <div id="properties-header">Properties</div>
    <div id="properties-content">
      <div id="no-selection">Select an element to edit its properties</div>
    </div>
  </div>
</div>

<div id="statusbar">
  <span id="status-pos">x: 0  y: 0</span>
  <span id="status-nodes">Nodes: 0</span>
  <span id="status-edges">Edges: 0</span>
  <span id="status-hint">Drag palette items · Double-tap/click to rename · Pinch to zoom</span>
</div>

<div id="context-menu">
  <div class="ctx-item" id="ctx-edit">Edit Label</div>
  <div class="ctx-item" id="ctx-drill">Drill Down ▶</div>
  <div class="ctx-separator"></div>
  <div class="ctx-item" id="ctx-color">Change Color…</div>
  <div class="ctx-item" id="ctx-duplicate">Duplicate</div>
  <div class="ctx-separator"></div>
  <div class="ctx-item danger" id="ctx-delete">Delete</div>
</div>

<div id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Import / Export</h2>
    <textarea id="modal-textarea" spellcheck="false"></textarea>
    <div class="modal-buttons">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-ok">OK</button>
    </div>
  </div>
</div>

<div id="tooltip"></div>
<div id="drag-ghost"></div>

<script>
'use strict';
// ─── Level config ────────────────────────────────────────────────────────────
const LEVELS = ['context','container','component','code'];

const LEVEL_CONFIG = {
  context: {
    label: 'System Context',
    shapes: [
      { type:'person',   label:'Person',         color:'#1168bd', icon:'👤' },
      { type:'system',   label:'System',          color:'#1168bd', icon:'⬛' },
      { type:'external', label:'External System', color:'#999999', icon:'⬚' },
    ],
    legend: [
      { color:'#1168bd', border:'#0d5094', label:'Internal / Person' },
      { color:'#999999', border:'#777777', label:'External System'   },
    ]
  },
  container: {
    label: 'Container',
    shapes: [
      { type:'webapp',    label:'Web App',        color:'#1168bd', icon:'🌐' },
      { type:'mobileapp', label:'Mobile App',     color:'#1168bd', icon:'📱' },
      { type:'api',       label:'API / Service',  color:'#1168bd', icon:'⚙️' },
      { type:'database',  label:'Database',       color:'#1168bd', icon:'🗄️' },
      { type:'queue',     label:'Message Queue',  color:'#e67e22', icon:'📨' },
      { type:'person',    label:'Person',         color:'#888888', icon:'👤' },
      { type:'external',  label:'External',       color:'#999999', icon:'⬚' },
    ],
    legend: [
      { color:'#1168bd', border:'#0d5094', label:'Container'     },
      { color:'#e67e22', border:'#c0651a', label:'Queue'         },
      { color:'#999999', border:'#777777', label:'External'      },
    ]
  },
  component: {
    label: 'Component',
    shapes: [
      { type:'component', label:'Component',   color:'#1168bd', icon:'🔷' },
      { type:'service',   label:'Service',     color:'#27ae60', icon:'⚡' },
      { type:'repo',      label:'Repository',  color:'#8e44ad', icon:'📦' },
      { type:'facade',    label:'Facade',      color:'#16a085', icon:'🔲' },
      { type:'factory',   label:'Factory',     color:'#d35400', icon:'🏭' },
      { type:'external',  label:'External',    color:'#999999', icon:'⬚' },
    ],
    legend: [
      { color:'#1168bd', border:'#0d5094', label:'Component'  },
      { color:'#27ae60', border:'#1e8449', label:'Service'    },
      { color:'#8e44ad', border:'#6c3483', label:'Repository' },
      { color:'#999999', border:'#777777', label:'External'   },
    ]
  },
  code: {
    label: 'Code / Class',
    shapes: [
      { type:'class',     label:'Class',       color:'#2c3e50', icon:'📄' },
      { type:'interface', label:'Interface',   color:'#16a085', icon:'📋' },
      { type:'abstract',  label:'Abstract',    color:'#2980b9', icon:'📝' },
      { type:'enum',      label:'Enum',        color:'#8e44ad', icon:'🔢' },
      { type:'package',   label:'Package',     color:'#555555', icon:'📦' },
    ],
    legend: [
      { color:'#2c3e50', border:'#1a252f', label:'Class'     },
      { color:'#16a085', border:'#0e6655', label:'Interface' },
      { color:'#2980b9', border:'#1a5276', label:'Abstract'  },
      { color:'#8e44ad', border:'#6c3483', label:'Enum'      },
    ]
  }
};

const STEREO = {
  person:'Person', system:'Software System', external:'External System',
  webapp:'Web App', mobileapp:'Mobile App', api:'API / Service',
  database:'Database', queue:'Message Queue',
  component:'Component', service:'Service', repo:'Repository',
  facade:'Facade', factory:'Factory',
  class:'Class', interface:'Interface', abstract:'Abstract Class',
  enum:'Enumeration', package:'Package'
};

// ─── State ───────────────────────────────────────────────────────────────────
const NODE_W = 140, NODE_H = 80;

let state = {
  currentLevel: 'context',
  diagrams: { context:{nodes:[],edges:[]}, container:{nodes:[],edges:[]}, component:{nodes:[],edges:[]}, code:{nodes:[],edges:[]} },
  view: { x: 40, y: 40, zoom: 1 },
  selection: [],
  hovered: null,
  drillStack: [],
  addingRelation: false,
  relationStart: null,
  _mouseWorld: null,
  nextId: 1,
};

function getDiagram() { return state.diagrams[state.currentLevel]; }
function genId() { return 's_' + (state.nextId++); }

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const ccont   = document.getElementById('canvas-container');
const mmCanvas = document.getElementById('minimap');
const mctx    = mmCanvas.getContext('2d');

function resize() {
  canvas.width  = ccont.clientWidth;
  canvas.height = ccont.clientHeight;
  render();
}
new ResizeObserver(resize).observe(ccont);
resize();

// ─── Coord helpers ────────────────────────────────────────────────────────────
const toWorld  = (sx,sy) => ({ x:(sx-state.view.x)/state.view.zoom, y:(sy-state.view.y)/state.view.zoom });
const toScreen = (wx,wy) => ({ x: wx*state.view.zoom+state.view.x,  y: wy*state.view.zoom+state.view.y  });

// ─── Node helpers ─────────────────────────────────────────────────────────────
const nodeRect   = n => ({ x:n.x, y:n.y, w:n.w||NODE_W, h:n.h||NODE_H });
const nodeCenter = n => { const r=nodeRect(n); return {x:r.x+r.w/2, y:r.y+r.h/2}; };
const LEVEL_ORDER = ['context','container','component','code'];
const canDrillDown = n => LEVEL_ORDER.indexOf(state.currentLevel) < 3 && n.type !== 'person' && n.type !== 'external';

function hitNode(wx, wy) {
  const nodes = getDiagram().nodes;
  for (let i = nodes.length-1; i >= 0; i--) {
    const r = nodeRect(nodes[i]);
    if (wx>=r.x && wx<=r.x+r.w && wy>=r.y && wy<=r.y+r.h) return nodes[i];
  }
  return null;
}

function hitEdge(wx, wy) {
  const {nodes, edges} = getDiagram();
  const thresh = 7 / state.view.zoom;
  for (const e of edges) {
    const fn = nodes.find(n=>n.id===e.from), tn = nodes.find(n=>n.id===e.to);
    if (!fn||!tn) continue;
    const p1 = nodeCenter(fn), p2 = nodeCenter(tn);
    if (ptSegDist(wx,wy,p1.x,p1.y,p2.x,p2.y) < thresh) return e;
  }
  return null;
}

function ptSegDist(px,py,ax,ay,bx,by) {
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  if (l2===0) return Math.hypot(px-ax,py-ay);
  const t = Math.max(0, Math.min(1, ((px-ax)*dx+(py-ay)*dy)/l2));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

function edgeEndpoint(from, to) {
  const rf=nodeRect(from), rt=nodeRect(to);
  const fx=rf.x+rf.w/2, fy=rf.y+rf.h/2, tx=rt.x+rt.w/2, ty=rt.y+rt.h/2;
  const dx=tx-fx, dy=ty-fy, hw=rt.w/2, hh=rt.h/2;
  let t=Infinity;
  if(dx!==0){const t1=(tx-hw-fx)/dx; if(t1>0&&t1<t){const y=fy+t1*dy; if(Math.abs(y-ty)<=hh)t=t1;} const t2=(tx+hw-fx)/dx; if(t2>0&&t2<t){const y=fy+t2*dy; if(Math.abs(y-ty)<=hh)t=t2;}}
  if(dy!==0){const t3=(ty-hh-fy)/dy; if(t3>0&&t3<t){const x=fx+t3*dx; if(Math.abs(x-tx)<=hw)t=t3;} const t4=(ty+hh-fy)/dy; if(t4>0&&t4<t){const x=fx+t4*dx; if(Math.abs(x-tx)<=hw)t=t4;}}
  return isFinite(t) ? {x:fx+t*dx, y:fy+t*dy} : {x:tx, y:ty};
}

// ─── Theme helpers ────────────────────────────────────────────────────────────
const getVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function themeColors() {
  return {
    grid:       getVar('--grid'),
    edgeLabel:  getVar('--bg-canvas'),
    edgeLabelFg:getVar('--text'),
    accent:     getVar('--accent'),
  };
}

// ─── Color utils ──────────────────────────────────────────────────────────────
function adjustColor(hex, amount) {
  const c = parseInt(hex.replace('#',''),16);
  const r = Math.min(255,Math.max(0,(c>>16)+amount));
  const g = Math.min(255,Math.max(0,((c>>8)&0xff)+amount));
  const b = Math.min(255,Math.max(0,(c&0xff)+amount));
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
const darken  = (h,a) => adjustColor(h,-a);
const lighten = (h,a) => adjustColor(h, a);

// ─── Drawing ──────────────────────────────────────────────────────────────────
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

function drawGrid() {
  const gs = 20 * state.view.zoom;
  if (gs < 4) return;
  const ox = state.view.x % gs, oy = state.view.y % gs;
  ctx.strokeStyle = themeColors().grid;
  ctx.lineWidth = 1;
  for (let x=ox; x<canvas.width; x+=gs)  { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for (let y=oy; y<canvas.height; y+=gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
}

function wrapText(c, text, maxW) {
  const words = String(text||'').split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur+' '+w : w;
    if (c.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawNode(n) {
  const r   = nodeRect(n);
  const sel = state.selection.includes(n.id);
  const hov = state.hovered === n.id;
  const col = n.color || '#1168bd';
  const dark = darken(col, 40);

  ctx.save();

  if (sel) { ctx.shadowColor = getVar('--accent'); ctx.shadowBlur = 14; }
  else if (hov) { ctx.shadowColor = 'rgba(128,128,128,0.5)'; ctx.shadowBlur = 10; }

  ctx.fillStyle   = col;
  ctx.strokeStyle = dark;
  ctx.lineWidth   = sel ? 2.5 : 1.5;

  if (n.type === 'person') {
    // Stick figure — drawn manually, no fill-rect header
    ctx.shadowBlur = 0;
    const cx   = r.x + r.w/2;
    const hr   = Math.min(r.w, r.h) * 0.18;
    const hy   = r.y + hr + 4;
    const body = hy + hr;
    ctx.beginPath(); ctx.arc(cx, hy, hr, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, body); ctx.lineTo(cx, r.y+r.h-14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r.x+12, body+12); ctx.lineTo(r.x+r.w-12, body+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, r.y+r.h-14); ctx.lineTo(r.x+16, r.y+r.h-2); ctx.moveTo(cx, r.y+r.h-14); ctx.lineTo(r.x+r.w-16, r.y+r.h-2); ctx.stroke();
    // Label below figure
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px -apple-system,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const lines = wrapText(ctx, n.label||'Person', r.w-8);
    let ly = r.y + r.h*0.66;
    for (const l of lines) { ctx.fillText(l, cx, ly); ly += 14; }
    ctx.restore(); return;
  }

  if (n.type === 'database') {
    const ry = r.h * 0.13;
    ctx.beginPath();
    ctx.ellipse(r.x+r.w/2, r.y+ry, r.w/2, ry, 0, Math.PI, 0);
    ctx.lineTo(r.x+r.w, r.y+r.h-ry);
    ctx.ellipse(r.x+r.w/2, r.y+r.h-ry, r.w/2, ry, 0, 0, Math.PI);
    ctx.closePath();
  } else if (n.type === 'queue') {
    const rx = r.w * 0.12;
    ctx.beginPath();
    ctx.ellipse(r.x+rx, r.y+r.h/2, rx, r.h/2, 0, Math.PI/2, Math.PI*1.5);
    ctx.lineTo(r.x+r.w-rx, r.y);
    ctx.ellipse(r.x+r.w-rx, r.y+r.h/2, rx, r.h/2, 0, Math.PI*1.5, Math.PI/2);
    ctx.closePath();
  } else if (n.type === 'interface') {
    ctx.setLineDash([5,3]);
    roundRect(ctx, r.x, r.y, r.w, r.h, 8);
    ctx.setLineDash([]);
  } else {
    roundRect(ctx, r.x, r.y, r.w, r.h, 6);
  }
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;

  // Header strip
  const tagH = 18;
  if (n.type !== 'database' && n.type !== 'queue') {
    ctx.save();
    ctx.clip();
    ctx.fillStyle = darken(col, 28);
    ctx.fillRect(r.x, r.y, r.w, tagH);
    ctx.restore();
  }

  // Stereotype
  const stereo = n.stereotype || STEREO[n.type] || n.type;
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.font = '10px -apple-system,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`«${stereo}»`, r.x+r.w/2, r.y+tagH/2);

  // Name
  const topY  = r.y + tagH + 6;
  const avail = r.h - tagH - 12;
  const nameLines = wrapText(ctx, n.label||'Untitled', r.w-14);
  const tech  = n.technology ? `[${n.technology}]` : '';
  const descL = n.description ? wrapText(ctx, n.description, r.w-12).slice(0,2) : [];
  const total = nameLines.length*15 + (tech?12:0) + (descL.length?(descL.length*11+4):0);
  let ty = topY + Math.max(0,(avail-total)/2);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px -apple-system,sans-serif';
  for (const l of nameLines) { ctx.fillText(l, r.x+r.w/2, ty+7); ty+=15; }

  if (tech) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = 'italic 10px -apple-system,sans-serif';
    ctx.fillText(tech, r.x+r.w/2, ty+5); ty+=12;
  }
  if (descL.length) {
    ty+=2;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '10px -apple-system,sans-serif';
    for (const dl of descL) { ctx.fillText(dl, r.x+r.w/2, ty+5); ty+=11; }
  }

  // Drill-down badge
  if (canDrillDown(n)) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('⊕', r.x+r.w-5, r.y+r.h-4);
  }

  ctx.restore();
}

function drawEdge(e) {
  const {nodes} = getDiagram();
  const fn = nodes.find(n=>n.id===e.from), tn = nodes.find(n=>n.id===e.to);
  if (!fn||!tn) return;
  const p1 = edgeEndpoint(tn, fn), p2 = edgeEndpoint(fn, tn);
  const sel = state.selection.includes(e.id);
  const tc  = themeColors();

  ctx.save();
  ctx.strokeStyle = sel ? tc.accent : (e.color||'#888888');
  ctx.lineWidth   = sel ? 2 : 1.5;
  if (e.style==='dashed') ctx.setLineDash([6,4]);
  else if (e.style==='dotted') ctx.setLineDash([2,3]);

  ctx.beginPath();
  if (e.curved) {
    const mx=(p1.x+p2.x)/2+(p2.y-p1.y)*0.2, my=(p1.y+p2.y)/2-(p2.x-p1.x)*0.2;
    ctx.moveTo(p1.x,p1.y); ctx.quadraticCurveTo(mx,my,p2.x,p2.y);
  } else {
    ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
  }
  ctx.stroke(); ctx.setLineDash([]);

  // Arrowhead
  const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy);
  if (len > 1) {
    const ux=dx/len, uy=dy/len, al=10, aw=5;
    const ax=p2.x-ux*al, ay=p2.y-uy*al;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(p2.x,p2.y);
    ctx.lineTo(ax-uy*aw, ay+ux*aw);
    ctx.lineTo(ax+uy*aw, ay-ux*aw);
    ctx.closePath();
    if (e.arrowType==='open') ctx.stroke(); else ctx.fill();
  }

  // Label
  if (e.label) {
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    ctx.font = '11px -apple-system,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const mw = ctx.measureText(e.label).width;
    ctx.fillStyle = tc.edgeLabel;
    ctx.fillRect(mx-mw/2-3, my-7, mw+6, 14);
    ctx.fillStyle = tc.edgeLabelFg;
    ctx.fillText(e.label, mx, my);
    if (e.technology) {
      ctx.fillStyle = getVar('--text-muted');
      ctx.font = 'italic 10px sans-serif';
      ctx.fillText(`[${e.technology}]`, mx, my+13);
    }
  }
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  ctx.save();
  ctx.translate(state.view.x, state.view.y);
  ctx.scale(state.view.zoom, state.view.zoom);

  const {nodes, edges} = getDiagram();
  for (const e of edges) drawEdge(e);

  // In-progress relation line
  if (state.addingRelation && state.relationStart && state._mouseWorld) {
    const fn = nodes.find(n=>n.id===state.relationStart);
    if (fn) {
      const p = nodeCenter(fn);
      ctx.save();
      ctx.strokeStyle = getVar('--accent');
      ctx.lineWidth = 1.5; ctx.setLineDash([6,3]);
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(state._mouseWorld.x, state._mouseWorld.y);
      ctx.stroke(); ctx.restore();
    }
  }

  for (const n of nodes) drawNode(n);
  ctx.restore();
  drawMinimap();
  updateStatus();
}

// ─── Minimap ──────────────────────────────────────────────────────────────────
function drawMinimap() {
  const {nodes} = getDiagram();
  const mw=150, mh=110;
  mctx.clearRect(0,0,mw,mh);
  mctx.fillStyle = getVar('--bg-panel');
  mctx.fillRect(0,0,mw,mh);
  if (!nodes.length) return;

  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for (const n of nodes) { const r=nodeRect(n); minX=Math.min(minX,r.x); minY=Math.min(minY,r.y); maxX=Math.max(maxX,r.x+r.w); maxY=Math.max(maxY,r.y+r.h); }
  const pad=12, sc=Math.min((mw-pad*2)/(maxX-minX||1),(mh-pad*2)/(maxY-minY||1));
  const ox=pad-minX*sc, oy=pad-minY*sc;
  for (const n of nodes) {
    const r=nodeRect(n);
    mctx.fillStyle = n.color||'#1168bd';
    mctx.fillRect(r.x*sc+ox, r.y*sc+oy, r.w*sc, r.h*sc);
  }
  mctx.strokeStyle = getVar('--accent');
  mctx.lineWidth = 1;
  const vx=(-state.view.x/state.view.zoom)*sc+ox, vy=(-state.view.y/state.view.zoom)*sc+oy;
  const vw=(canvas.width/state.view.zoom)*sc, vh=(canvas.height/state.view.zoom)*sc;
  mctx.strokeRect(vx,vy,vw,vh);
}

function updateStatus() {
  document.getElementById('status-nodes').textContent = `Nodes: ${getDiagram().nodes.length}`;
  document.getElementById('status-edges').textContent = `Edges: ${getDiagram().edges.length}`;
  document.getElementById('zoom-label').textContent   = `${Math.round(state.view.zoom*100)}%`;
}

// ─── Legend & palette ─────────────────────────────────────────────────────────
function updateLegend() {
  const el  = document.getElementById('legend');
  el.innerHTML = '';
  for (const l of LEVEL_CONFIG[state.currentLevel].legend) {
    const d = document.createElement('div');
    d.innerHTML = `<span class="legend-box" style="background:${l.color};border-color:${l.border}"></span><span>${l.label}</span>`;
    el.appendChild(d);
  }
}

function buildPalette() {
  const pal = document.getElementById('shape-palette');
  pal.innerHTML = '';
  for (const s of LEVEL_CONFIG[state.currentLevel].shapes) {
    const el = document.createElement('div');
    el.className = 'shape-item';
    el.innerHTML = `<span class="shape-icon">${s.icon}</span><span>${s.label}</span>`;
    el.dataset.type  = s.type;
    el.dataset.color = s.color;
    el.dataset.label = s.label;
    attachPaletteDrag(el);
    pal.appendChild(el);
  }
}

// ─── Palette drag (pointer events — works on mouse AND touch) ─────────────────
let palDrag = null; // { type, color, label }
const ghost = document.getElementById('drag-ghost');

function attachPaletteDrag(el) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    palDrag = { type: el.dataset.type, color: el.dataset.color, label: el.dataset.label };
    ghost.textContent = `+ ${palDrag.label}`;
    ghost.style.display = 'block';
    moveGhost(e.clientX, e.clientY);
  });
  el.addEventListener('pointermove', e => {
    if (!palDrag) return;
    e.preventDefault();
    moveGhost(e.clientX, e.clientY);
  });
  el.addEventListener('pointerup', e => {
    if (!palDrag) return;
    ghost.style.display = 'none';
    const canvRect = canvas.getBoundingClientRect();
    const sx = e.clientX - canvRect.left, sy = e.clientY - canvRect.top;
    if (sx >= 0 && sy >= 0 && sx <= canvas.width && sy <= canvas.height) {
      const w = toWorld(sx, sy);
      addNode(palDrag.type, palDrag.color, palDrag.label, w.x - NODE_W/2, w.y - NODE_H/2);
      closeDrawers();
    }
    palDrag = null;
  });
  el.addEventListener('pointercancel', () => { palDrag = null; ghost.style.display = 'none'; });
}

function moveGhost(cx, cy) {
  ghost.style.left = (cx + 12) + 'px';
  ghost.style.top  = (cy - 14) + 'px';
}

function addNode(type, color, label, x, y) {
  const node = { id:genId(), type, color, label, x:Math.round(x/10)*10, y:Math.round(y/10)*10, w:NODE_W, h:NODE_H, description:'', technology:'' };
  getDiagram().nodes.push(node);
  state.selection = [node.id];
  render(); updateProperties();
  return node;
}

// ─── Canvas pointer interaction ───────────────────────────────────────────────
let isDragging=false, dragOffsets=[], isPanning=false, panStart=null;
let isResizing=false, resizeNode=null, resizeStart=null;
let isSelecting=false, selStart=null;
let spaceDown=false;
let longPressTimer=null, longPressTarget=null;

// Pinch-zoom state
let activeTouches=new Map(); // pointerId → {x,y}
let pinchStartDist=0, pinchStartZoom=1, pinchStartMid={x:0,y:0};

canvas.addEventListener('pointerdown',  onPointerDown);
canvas.addEventListener('pointermove',  onPointerMove);
canvas.addEventListener('pointerup',    onPointerUp);
canvas.addEventListener('pointercancel',onPointerCancel);
canvas.addEventListener('dblclick',     onDblClick);
canvas.addEventListener('contextmenu',  onContextMenu);
canvas.addEventListener('wheel',        onWheel, {passive:false});

document.addEventListener('keydown', e => {
  if (e.code==='Space' && e.target===document.body) { e.preventDefault(); spaceDown=true; canvas.classList.add('panning'); }
  if ((e.key==='Delete'||e.key==='Backspace') && e.target===document.body) deleteSelected();
  if (e.key==='Escape') { cancelRelation(); hideContextMenu(); }
  if (e.ctrlKey && e.key==='a') { e.preventDefault(); selectAll(); }
});
document.addEventListener('keyup', e => {
  if (e.code==='Space') { spaceDown=false; canvas.classList.remove('panning','panning-active'); }
});

function cpPos(e) {
  const r = canvas.getBoundingClientRect();
  return { sx: e.clientX-r.left, sy: e.clientY-r.top };
}

function onPointerDown(e) {
  canvas.setPointerCapture(e.pointerId);
  activeTouches.set(e.pointerId, {x:e.clientX, y:e.clientY});

  // Two-finger pinch starts
  if (activeTouches.size === 2) {
    const pts = [...activeTouches.values()];
    pinchStartDist = Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
    pinchStartZoom = state.view.zoom;
    const cr = canvas.getBoundingClientRect();
    pinchStartMid = { x:(pts[0].x+pts[1].x)/2 - cr.left, y:(pts[0].y+pts[1].y)/2 - cr.top };
    isPanning = false; isDragging = false;
    return;
  }

  if (e.button===1 || (e.button===0 && spaceDown) || (e.pointerType==='touch' && activeTouches.size===1 && !state.addingRelation)) {
    // Pan — for touch single-finger we start pan but allow it to become a tap if movement is small
    if (e.button===1 || spaceDown) {
      isPanning = true;
      panStart = {x:e.clientX-state.view.x, y:e.clientY-state.view.y};
      canvas.classList.add('panning-active');
      return;
    }
  }
  if (e.button!==0) return;

  const {sx,sy} = cpPos(e);
  const w = toWorld(sx,sy);

  // Long-press for context menu on touch
  if (e.pointerType==='touch') {
    longPressTarget = {sx,sy,w};
    longPressTimer  = setTimeout(() => {
      const hit = hitNode(longPressTarget.w.x, longPressTarget.w.y);
      ctxTarget = hit || hitEdge(longPressTarget.w.x, longPressTarget.w.y);
      if (ctxTarget) showContextMenu(longPressTarget.sx + canvas.getBoundingClientRect().left, longPressTarget.sy + canvas.getBoundingClientRect().top);
      longPressTimer = null;
    }, 520);
  }

  if (state.addingRelation) {
    const hit = hitNode(w.x, w.y);
    if (hit) {
      if (!state.relationStart) { state.relationStart = hit.id; }
      else if (hit.id !== state.relationStart) { addEdge(state.relationStart, hit.id); cancelRelation(); }
    } else cancelRelation();
    return;
  }

  const hit = hitNode(w.x, w.y);
  if (hit) {
    // Resize handle
    const r = nodeRect(hit);
    const hs = 12 / state.view.zoom;
    if (w.x > r.x+r.w-hs && w.y > r.y+r.h-hs) {
      isResizing=true; resizeNode=hit; resizeStart={x:w.x,y:w.y,w:r.w,h:r.h}; return;
    }
    if (!e.shiftKey && !state.selection.includes(hit.id)) state.selection=[hit.id];
    else if (e.shiftKey) {
      state.selection = state.selection.includes(hit.id) ? state.selection.filter(i=>i!==hit.id) : [...state.selection,hit.id];
    } else if (!state.selection.includes(hit.id)) { state.selection=[hit.id]; }
    isDragging=true;
    dragOffsets = state.selection.map(id => {
      const n=getDiagram().nodes.find(n=>n.id===id);
      return {id, dx:w.x-n.x, dy:w.y-n.y};
    });
    updateProperties(); render();
  } else {
    const ehit = hitEdge(w.x, w.y);
    if (ehit) { state.selection=[ehit.id]; updateProperties(); render(); return; }
    state.selection=[]; isSelecting=true; selStart={x:sx,y:sy};
    updateProperties(); render();
  }
}

let pointerMoved = false;
function onPointerMove(e) {
  activeTouches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  pointerMoved = true;

  // Pinch zoom
  if (activeTouches.size===2) {
    const pts=[...activeTouches.values()];
    const dist=Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
    const newZoom = Math.max(0.1, Math.min(4, pinchStartZoom * dist/pinchStartDist));
    const cr=canvas.getBoundingClientRect();
    const mx=(pts[0].x+pts[1].x)/2-cr.left, my=(pts[0].y+pts[1].y)/2-cr.top;
    const wx=(mx-state.view.x)/state.view.zoom, wy=(my-state.view.y)/state.view.zoom;
    state.view.zoom=newZoom;
    state.view.x=mx-wx*newZoom; state.view.y=my-wy*newZoom;
    clearLongPress();
    render(); return;
  }

  // Single-finger touch pan (only when not on a node and not adding relation)
  if (e.pointerType==='touch' && activeTouches.size===1 && !isDragging && !state.addingRelation) {
    if (!isPanning) {
      if (longPressTarget) {
        const dx=e.clientX-longPressTarget.sx-canvas.getBoundingClientRect().left;
        const dy=e.clientY-longPressTarget.sy-canvas.getBoundingClientRect().top;
        if (Math.hypot(dx,dy) > 8) { clearLongPress(); isPanning=true; panStart={x:e.clientX-state.view.x,y:e.clientY-state.view.y}; }
      }
    }
    if (isPanning) { clearLongPress(); state.view.x=e.clientX-panStart.x; state.view.y=e.clientY-panStart.y; render(); return; }
  }

  if (isPanning) { clearLongPress(); state.view.x=e.clientX-panStart.x; state.view.y=e.clientY-panStart.y; render(); return; }

  const {sx,sy}=cpPos(e);
  const w=toWorld(sx,sy);

  if (isResizing && resizeNode) {
    resizeNode.w = Math.max(80,  resizeStart.w + (w.x-resizeStart.x));
    resizeNode.h = Math.max(50,  resizeStart.h + (w.y-resizeStart.y));
    render(); return;
  }

  if (isDragging && dragOffsets.length) {
    clearLongPress();
    const nodes=getDiagram().nodes;
    for (const o of dragOffsets) {
      const n=nodes.find(n=>n.id===o.id);
      if(n){n.x=Math.round((w.x-o.dx)/10)*10; n.y=Math.round((w.y-o.dy)/10)*10;}
    }
    render(); return;
  }

  if (isSelecting) {
    const box=document.getElementById('selection-box');
    const x1=Math.min(selStart.x,sx), y1=Math.min(selStart.y,sy), x2=Math.max(selStart.x,sx), y2=Math.max(selStart.y,sy);
    Object.assign(box.style,{display:'block',left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px'});
    return;
  }

  // Hover + tooltip (mouse only)
  if (e.pointerType==='mouse') {
    const hit=hitNode(w.x,w.y);
    if (hit?.id!==state.hovered) { state.hovered=hit?hit.id:null; render(); }

    if (hit && (hit.description||hit.technology)) {
      const tip=document.getElementById('tooltip');
      tip.textContent=(hit.technology?`[${hit.technology}] `:'')+( hit.description||'');
      Object.assign(tip.style,{display:'block',left:(e.clientX+14)+'px',top:(e.clientY-4)+'px'});
    } else document.getElementById('tooltip').style.display='none';

    const r=hit?nodeRect(hit):null;
    const hs=12/state.view.zoom;
    canvas.style.cursor = r&&w.x>r.x+r.w-hs&&w.y>r.y+r.h-hs ? 'nwse-resize' : hit?'move':'';
    document.getElementById('status-pos').textContent=`x: ${Math.round(w.x)}  y: ${Math.round(w.y)}`;
  }

  if (state.addingRelation) { state._mouseWorld=w; render(); }
}

function onPointerUp(e) {
  activeTouches.delete(e.pointerId);
  clearLongPress();

  if (isPanning && activeTouches.size===0) { isPanning=false; canvas.classList.remove('panning-active'); return; }
  if (isResizing) { isResizing=false; resizeNode=null; return; }
  if (isDragging) { isDragging=false; dragOffsets=[]; return; }
  if (isSelecting) {
    isSelecting=false;
    const box=document.getElementById('selection-box'); box.style.display='none';
    const {sx,sy}=cpPos(e);
    const x1=Math.min(selStart.x,sx), y1=Math.min(selStart.y,sy), x2=Math.max(selStart.x,sx), y2=Math.max(selStart.y,sy);
    if (x2-x1>5||y2-y1>5) {
      const w1=toWorld(x1,y1), w2=toWorld(x2,y2);
      state.selection=getDiagram().nodes.filter(n=>{const r=nodeRect(n);return r.x<w2.x&&r.x+r.w>w1.x&&r.y<w2.y&&r.y+r.h>w1.y;}).map(n=>n.id);
      updateProperties(); render();
    }
  }
}

function onPointerCancel(e) { activeTouches.delete(e.pointerId); clearLongPress(); isPanning=false; isDragging=false; isResizing=false; isSelecting=false; document.getElementById('selection-box').style.display='none'; }

function clearLongPress() { if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;} longPressTarget=null; }

function onDblClick(e) {
  const {sx,sy}=cpPos(e);
  const hit=hitNode(toWorld(sx,sy).x, toWorld(sx,sy).y);
  if (hit) {
    const v=prompt('Label:',hit.label);
    if(v!==null){hit.label=v; render(); updateProperties();}
  }
}

function onWheel(e) {
  e.preventDefault();
  const {sx,sy}=cpPos(e);
  const factor=e.deltaY<0?1.12:1/1.12;
  const wx=(sx-state.view.x)/state.view.zoom, wy=(sy-state.view.y)/state.view.zoom;
  state.view.zoom=Math.max(0.1,Math.min(4,state.view.zoom*factor));
  state.view.x=sx-wx*state.view.zoom; state.view.y=sy-wy*state.view.zoom;
  render();
}

// ─── Drill-down ───────────────────────────────────────────────────────────────
function drillDown(node) {
  const idx=LEVEL_ORDER.indexOf(state.currentLevel);
  if (idx>=3) return;
  state.drillStack.push({level:state.currentLevel, nodeId:node.id, nodeLabel:node.label});
  switchLevel(LEVEL_ORDER[idx+1]);
  updateBreadcrumb();
}

function updateBreadcrumb() {
  const bc=document.getElementById('breadcrumb');
  bc.innerHTML='';
  const stack=[...state.drillStack];
  if (!stack.length) return;
  const sep=()=>{const s=document.createElement('span');s.className='bc-sep';s.textContent='›';bc.appendChild(s);};
  stack.forEach((entry,i)=>{
    const s=document.createElement('span'); s.className='bc-item'; s.textContent=entry.nodeLabel;
    s.addEventListener('click',()=>{while(state.drillStack.length>i)state.drillStack.pop();switchLevel(stack[i].level);updateBreadcrumb();});
    bc.appendChild(s); sep();
  });
  const cur=document.createElement('span'); cur.className='bc-current'; cur.textContent=LEVEL_CONFIG[state.currentLevel].label;
  bc.appendChild(cur);
}

// ─── Edges ────────────────────────────────────────────────────────────────────
function addEdge(fromId, toId) {
  const e={id:genId(),from:fromId,to:toId,label:'',technology:'',style:'solid',arrowType:'filled'};
  getDiagram().edges.push(e); state.selection=[e.id]; render(); updateProperties(); return e;
}

function cancelRelation() {
  state.addingRelation=false; state.relationStart=null; state._mouseWorld=null;
  const btn=document.getElementById('btn-add-rel');
  btn.textContent='+ Relation'; btn.classList.remove('active');
  canvas.classList.remove('adding-rel');
  render();
}

document.getElementById('btn-add-rel').addEventListener('click', ()=>{

  state.addingRelation=true; state.relationStart=null;
  const btn=document.getElementById('btn-add-rel');
  btn.textContent='Cancel (Esc)'; btn.classList.add('active');
  canvas.classList.add('adding-rel');
  document.getElementById('status-hint').textContent='Tap source node → tap target node';
});

// ─── Properties panel ─────────────────────────────────────────────────────────
function updateProperties() {
  const c=document.getElementById('properties-content');
  c.innerHTML='';
  if (!state.selection.length) { c.innerHTML='<div id="no-selection">Select an element to edit properties</div>'; return; }
  if (state.selection.length>1) { c.innerHTML=`<div id="no-selection">${state.selection.length} items selected</div>`; return; }

  const id=state.selection[0];
  const {nodes,edges}=getDiagram();
  const node=nodes.find(n=>n.id===id), edge=edges.find(e=>e.id===id);

  if (node) {
    textProp(c,'Label',node,'label');
    textareaProp(c,'Description',node,'description');
    textProp(c,'Technology',node,'technology');
    textProp(c,'Stereotype',node,'stereotype');
    colorProp(c,'Color',node,'color');
    sizeProp(c,node);
    if (canDrillDown(node)) {
      const b=document.createElement('button'); b.className='btn primary'; b.style.marginTop='8px'; b.textContent='Drill Down ▶';
      b.addEventListener('click',()=>drillDown(node)); c.appendChild(b);
    }
  } else if (edge) {
    textProp(c,'Label',edge,'label');
    textProp(c,'Technology',edge,'technology');
    selectProp(c,'Style',edge,'style',['solid','dashed','dotted']);
    selectProp(c,'Arrow',edge,'arrowType',['filled','open','diamond']);
    colorProp(c,'Color',edge,'color');
    const g=document.createElement('div'); g.className='prop-group';
    g.innerHTML=`<label class="prop-label" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" ${edge.curved?'checked':''}>Curved line</label>`;
    g.querySelector('input').addEventListener('change',e=>{edge.curved=e.target.checked;render();});
    c.appendChild(g);
  }
}

function mk(tag,cls,attrs={}) { const e=document.createElement(tag); if(cls)e.className=cls; Object.assign(e,attrs); return e; }
function propGroup(parent,label) { const g=mk('div','prop-group'); const l=mk('div','prop-label'); l.textContent=label; g.appendChild(l); parent.appendChild(g); return g; }

function textProp(parent,label,obj,key) {
  const g=propGroup(parent,label);
  const i=mk('input','prop-input',{type:'text',value:obj[key]||''});
  i.addEventListener('input',()=>{obj[key]=i.value;render();}); g.appendChild(i);
}
function textareaProp(parent,label,obj,key) {
  const g=propGroup(parent,label);
  const t=mk('textarea','prop-textarea'); t.value=obj[key]||'';
  t.addEventListener('input',()=>{obj[key]=t.value;render();}); g.appendChild(t);
}
function selectProp(parent,label,obj,key,opts) {
  const g=propGroup(parent,label);
  const s=mk('select','prop-select');
  opts.forEach(o=>{const op=mk('option'); op.value=o; op.textContent=o; if(o===obj[key])op.selected=true; s.appendChild(op);});
  s.addEventListener('change',()=>{obj[key]=s.value;render();}); g.appendChild(s);
}
function colorProp(parent,label,obj,key) {
  const g=propGroup(parent,label);
  const row=mk('div','prop-color');
  const cp=mk('input','',{type:'color',value:obj[key]||'#1168bd'});
  const hi=mk('input','prop-input',{type:'text',value:obj[key]||'#1168bd'});
  hi.style.flex='1';
  cp.addEventListener('input',()=>{obj[key]=cp.value;hi.value=cp.value;render();updateProperties();});
  hi.addEventListener('change',()=>{if(/^#[0-9a-fA-F]{6}$/.test(hi.value)){obj[key]=hi.value;cp.value=hi.value;render();}});
  row.appendChild(cp); row.appendChild(hi); g.appendChild(row);
}
function sizeProp(parent,node) {
  const g=propGroup(parent,'Size (W × H)');
  const row=mk('div'); row.style.cssText='display:flex;gap:4px';
  const wi=mk('input','prop-input',{type:'number',min:60,value:node.w||NODE_W}); wi.style.width='50%';
  const hi=mk('input','prop-input',{type:'number',min:40,value:node.h||NODE_H}); hi.style.width='50%';
  wi.addEventListener('input',()=>{node.w=+wi.value||NODE_W;render();});
  hi.addEventListener('input',()=>{node.h=+hi.value||NODE_H;render();});
  row.appendChild(wi); row.appendChild(hi); g.appendChild(row);
}

// ─── Level switching ──────────────────────────────────────────────────────────
function switchLevel(level) {
  state.currentLevel=level; state.selection=[];
  document.querySelectorAll('.level-tab').forEach(t=>t.classList.toggle('active',t.dataset.level===level));
  buildPalette(); updateLegend(); fitView(); updateProperties(); render();
}
document.querySelectorAll('.level-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{ state.drillStack=[]; switchLevel(tab.dataset.level); updateBreadcrumb(); });
});

// ─── Zoom / fit ───────────────────────────────────────────────────────────────
function fitView() {
  const {nodes}=getDiagram();
  if (!nodes.length) { state.view={x:40,y:40,zoom:1}; render(); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const n of nodes){const r=nodeRect(n);minX=Math.min(minX,r.x);minY=Math.min(minY,r.y);maxX=Math.max(maxX,r.x+r.w);maxY=Math.max(maxY,r.y+r.h);}
  const pad=60;
  state.view.zoom=Math.max(0.1,Math.min(1.5,Math.min((canvas.width-pad*2)/(maxX-minX||1),(canvas.height-pad*2)/(maxY-minY||1))));
  state.view.x=pad-minX*state.view.zoom; state.view.y=pad-minY*state.view.zoom;
  render();
}
document.getElementById('btn-zoom-in') .addEventListener('click',()=>{state.view.zoom=Math.min(4,state.view.zoom*1.2);render();});
document.getElementById('btn-zoom-out').addEventListener('click',()=>{state.view.zoom=Math.max(0.1,state.view.zoom/1.2);render();});
document.getElementById('btn-zoom-fit').addEventListener('click',fitView);

function deleteSelected() {
  if(!state.selection.length) return;
  const d=getDiagram(), ids=new Set(state.selection);
  d.nodes=d.nodes.filter(n=>!ids.has(n.id));
  d.edges=d.edges.filter(e=>!ids.has(e.id)&&!ids.has(e.from)&&!ids.has(e.to));
  state.selection=[]; render(); updateProperties();
}
function selectAll() { const d=getDiagram(); state.selection=[...d.nodes.map(n=>n.id),...d.edges.map(e=>e.id)]; updateProperties(); render(); }

  } else {
    try {
      const data=JSON.parse(document.getElementById('modal-textarea').value);
      if(data.context||data.container||data.component||data.code) {
        for(const l of LEVELS) if(data[l]) state.diagrams[l]=data[l];
      } else if(data.nodes&&data.edges) {
        state.diagrams[state.currentLevel]=data;
      }
      syncNextId(); document.getElementById('modal-overlay').classList.remove('open');
      render(); updateProperties();
    } catch{alert('Invalid JSON');}
  }
});
function syncNextId() {
  let max=state.nextId;
  for(const l of LEVELS){const d=state.diagrams[l];for(const n of [...d.nodes,...d.edges]){const m=parseInt(n.id.replace('s_',''));if(!isNaN(m))max=Math.max(max,m+1);}}
  state.nextId=max;
}
